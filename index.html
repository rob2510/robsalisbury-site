<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Retro Teletext / Pixel Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        teletext: ['"VT323"', 'monospace'],
                        pixel: ['"Silkscreen"', 'monospace'],
                    },
                    colors: {
                        ttBlack: '#000000',
                        ttWhite: '#FFFFFF',
                        ttYellow: '#FFFF00',
                        ttCyan: '#00FFFF',
                        ttGreen: '#00FF00',
                        ttMagenta: '#FF00FF',
                        ttRed: '#FF0000',
                        ttBlue: '#0000FF',
                        crtBezel: '#272522',
                        crtPlastic: '#3A3732',
                    }
                }

    <style>
        /* Classic Teletext Typography & Crisp Block Rendering */
        body {
            background-color: #121110;
            color: #FFFFFF;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
        }

        /* Retro 1980s CRT Television Casing */
        .crt-casing {
            background: linear-gradient(145deg, #3c3934 0%, #24221f 100%);
            border: 4px solid #171614;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.14),
                inset 0 -4px 10px rgba(0, 0, 0, 0.7),
                0 20px 50px rgba(0, 0, 0, 0.85);
        }

        .crt-inner-bezel {
            background: #141312;
            box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.95);
        }

        /* Authentic Pure Black Teletext Screen */
        .teletext-screen {
            background-color: #000000;
            position: relative;
            letter-spacing: 0.04em;
            line-height: 1.25;
        }

        /* Subtle CRT Scanlines & Phosphor Vignette */
        .crt-scanlines::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.34) 50%),
                radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.55) 100%);
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            z-index: 30;
        }

        /* Chunky Pixel Mosaic Blocks */
        .mosaic-grid {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            gap: 2px;
        }

        .teletext-btn {
            transition: transform 0.06s ease, filter 0.06s ease;
        }
        .teletext-btn:active {
            transform: translateY(2px);
        }

        /* Blinking Teletext Cursor / Status */
        @keyframes tt-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .animate-tt-blink {
            animation: tt-blink 1s infinite;
        }

        /* Custom Scrollbar for Terminal Areas */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #00FFFF;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-5 select-none">

    <!-- Custom Toast / Message Box (No alert() used) -->
    <div id="tt-toast" class="fixed bottom-4 right-4 z-50 hidden bg-ttYellow text-ttBlack border-4 border-ttBlack px-4 py-2 font-teletext text-2xl shadow-[6px_6px_0px_#00FFFF]">
        <span id="tt-toast-text">COPIED TO CLIPBOARD</span>

    <script>
        // --- State & Configuration ---
        let currentPage = '100';
        let isHeld = false;
        let crtEnabled = true;
        let digitBuffer = '';
        let digitBufferTimeout = null;
        let selectedDiagnostic = null;

        const randomSubjects = [
            "Quick hello from your Ceefax page",
            "Checking if rob@robsalisbury.com actually works",
            "Put the kettle on — non-urgent message",
            "I typed your URL by accident and stayed for Page 888",
            "Definitely not trying to sell you SEO services",
            "Urgent: Nothing is actually urgent"
        ];
        let subjectIndex = 0;

        // --- Toast Notification Helper ---
        function showToast(msg) {
            const toast = document.getElementById('tt-toast');
            const text = document.getElementById('tt-toast-text');
            text.textContent = msg;
            toast.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 2800);
        }

        // --- Live Rolling Header Clock ---
        function updateClock() {
            if (isHeld) return;
            const now = new Date();
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

            const dayStr = days[now.getDay()];
            const dateNum = String(now.getDate()).padStart(2, '0');
            const monthStr = months[now.getMonth()];

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('header-date').textContent = `${dayStr} ${dateNum} ${monthStr}`;
            document.getElementById('header-clock').textContent = `${hh}:${mm}:${ss}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Remote Control Toggles ---
        function toggleHold() {
            isHeld = !isHeld;
            const btn = document.getElementById('hold-btn');
            const indicator = document.getElementById('hold-indicator');
            btn.textContent = isHeld ? 'HOLD: ON' : 'HOLD: OFF';
            btn.classList.toggle('bg-ttRed', isHeld);
            btn.classList.toggle('text-ttWhite', isHeld);
            indicator.classList.toggle('hidden', !isHeld);
            showToast(isHeld ? 'PAGE & CLOCK FROZEN (HOLD)' : 'LIVE CLOCK RESUMED');
        }

        function toggleCRT() {
            crtEnabled = !crtEnabled;
            const screen = document.getElementById('teletext-screen');
            const btn = document.getElementById('crt-btn');
            screen.classList.toggle('crt-scanlines', crtEnabled);
            btn.textContent = crtEnabled ? 'CRT: ON' : 'CRT: OFF';
            showToast(crtEnabled ? 'CRT SCANLINES ENABLED' : 'CRT SCANLINES DISABLED');
        }

        function jumpFromInput() {
            const input = document.getElementById('page-jump-input');
            const val = input.value.trim();
            if (/^\d{3}$/.test(val)) {
                loadPage(val);
                input.value = '';
            } else {
                showToast('ENTER A 3-DIGIT PAGE (E.G. 100, 101, 200)');
            }
        }

        // --- Page Templates ---
        const pages = {
            '100': {
                ticker: 'P100 MAIN INDEX — ROBSALISBURY.COM OPERATES NORMAL EMAIL SERVICE',
                render: () => `
                    <div class="bg-ttRed text-ttWhite px-2 py-1 font-bold tracking-wide">
                        HEADLINE: DOMAIN STILL ONLY USED FOR EMAIL
                    </div>

                        Welcome to <span class="text-ttYellow">robsalisbury.com</span>. Despite looking like a 1986 BBC television broadcast, this domain exists purely to power <span class="text-ttCyan">rob@robsalisbury.com</span>.
                    </p>

                    <p class="text-ttGreen leading-snug">
                        There is no portfolio here, no thought-leadership blog, and no newsletter to unsubscribe from.
                    </p>

                    <div class="border-t-2 border-b-2 border-ttCyan py-2.5 my-2 space-y-1.5">
                        <div class="text-ttYellow font-bold mb-1">ROBFAX DIRECTORY — SELECT PAGE:</div>

                        <button onclick="loadPage('101')" class="w-full flex justify-between items-center text-left hover:bg-ttBlue px-1.5 py-0.5 cursor-pointer group">
                            <span class="text-ttCyan group-hover:text-ttWhite">1. Why are you on this website?</span>
                            <span class="text-ttYellow font-bold">101</span>
                        </button>

                        <button onclick="loadPage('200')" class="w-full flex justify-between items-center text-left hover:bg-ttBlue px-1.5 py-0.5 cursor-pointer group">
                            <span class="text-ttCyan group-hover:text-ttWhite">2. Send an email to Rob</span>
                            <span class="text-ttYellow font-bold">200</span>
                        </button>

                        <button onclick="loadPage('302')" class="w-full flex justify-between items-center text-left hover:bg-ttBlue px-1.5 py-0.5 cursor-pointer group">
                            <span class="text-ttCyan group-hover:text-ttWhite">3. UK Weather &amp; Tea Outlook</span>
                            <span class="text-ttYellow font-bold">302</span>
                        </button>

                        <button onclick="loadPage('888')" class="w-full flex justify-between items-center text-left hover:bg-ttBlue px-1.5 py-0.5 cursor-pointer group">
                            <span class="text-ttCyan group-hover:text-ttWhite">4. Ceefax Subtitles for the Hard of Hearing</span>
                            <span class="text-ttYellow font-bold">888</span>
                        </button>
                    </div>

                    <div class="text-ttMagenta text-lg sm:text-xl">
                        TIP: Type any 3-digit page number on your keyboard or press a colored button below.
                    </div>
                `
            },

            '101': {
                ticker: 'P101 VISITOR DIAGNOSTIC — IDENTIFY YOUR REASON FOR BROWSING',
                render: () => {
                    const diagnostics = [
                        {
                            id: 1,
                            label: '1. Checking if rob@robsalisbury.com is a real person',
                            response: 'CONFIRMED: Rob is a real human being. Your email is safe to send and will not vanish into a corporate black hole.'

                        {
                            id: 2,
                            label: '2. Typed the wrong web address by mistake',

                                ? `<p class="text-ttYellow leading-snug">${activeObj.response}</p>`

            },

            '888': {
                ticker: 'P888 CEEFAX SUBTITLES — PRESS 100 TO RETURN TO MAIN INDEX',
                render: () => `
                    <div class="flex items-center justify-between bg-ttWhite text-ttBlack px-2 py-1 font-bold">
                        <span>CEEFAX SUBTITLES</span>
                        <span>PAGE 888</span>
                    </div>

                    <div class="border-2 border-ttWhite p-4 my-2 space-y-3 text-center bg-ttBlack">
                        <p class="text-ttYellow text-2xl sm:text-3xl">
                            [SOUND OF KETTLE BOILING IN DISTANCE]
                        </p>
                        <p class="text-ttCyan text-2xl sm:text-3xl">
                            [MAN STARES THOUGHTFULLY AT EMPTY INBOX]
                        </p>
                        <p class="text-ttGreen text-2xl sm:text-3xl">
                            [GENTLE BRITISH TUTTING]
                        </p>
                        <p class="text-ttWhite text-xl pt-2">
                            End of programme. Please email <span class="text-ttYellow">rob@robsalisbury.com</span> if you need anything.
                        </p>
                    </div>
                `
            }
        };

        // --- Navigation & Interaction Functions ---
        function loadPage(pageNum) {
            const normalized = String(pageNum).padStart(3, '0');
            currentPage = normalized;

            document.getElementById('header-page-code').textContent = `P${normalized}`;
            document.getElementById('header-page-num').textContent = `1 ${normalized}`;

            const pageObj = pages[normalized];
            const container = document.getElementById('page-content');
            const ticker = document.getElementById('status-ticker');

            if (pageObj) {
                container.innerHTML = pageObj.render();
                ticker.textContent = pageObj.ticker;
            } else {
                ticker.textContent = `P${normalized} — PAGE NOT FOUND IN ROBFAX ARCHIVE`;
                container.innerHTML = `
                    <div class="bg-ttRed text-ttWhite px-2 py-1 font-bold">
                        ERROR: PAGE ${normalized} NOT TRANSMITTED
                    </div>
                    <p class="text-ttWhite">
                        Sorry, page <span class="text-ttYellow">${normalized}</span> is currently off-air.
                    </p>
                    <p class="text-ttCyan">
                        Available ROBFAX pages: <span class="text-ttYellow">100</span> (Index), <span class="text-ttYellow">101</span> (Visitor Check), <span class="text-ttYellow">200</span> (Email Rob), <span class="text-ttYellow">302</span> (Outlook), <span class="text-ttYellow">888</span> (Subtitles).
                    </p>
                    <button onclick="loadPage('100')" class="bg-ttYellow text-ttBlack font-bold px-3 py-1 cursor-pointer teletext-btn">
                        RETURN TO P100 INDEX
                    </button>
                `;
            }
        }

        function selectDiagnostic(id) {
            selectedDiagnostic = id;
            loadPage('101');
        }

        function cycleSubject() {
            subjectIndex = (subjectIndex + 1) % randomSubjects.length;
            const input = document.getElementById('tt-subject');
            if (input) {
                input.value = randomSubjects[subjectIndex];
            }
        }

        function copyEmail() {
            const email = 'rob@robsalisbury.com';
            const tempInput = document.createElement('input');
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast('COPIED: rob@robsalisbury.com');
        }

        function launchMailto() {
            const subjectEl = document.getElementById('tt-subject');
            const bodyEl = document.getElementById('tt-body');
            const subject = encodeURIComponent(subjectEl ? subjectEl.value : 'Hello Rob');
            const body = encodeURIComponent(bodyEl ? bodyEl.value : '');
            window.location.href = `mailto:rob@robsalisbury.com?subject=${subject}&body=${body}`;
            showToast('OPENING EMAIL CLIENT...');
        }

        // --- Keyboard 3-Digit Teletext Navigation ---
        document.addEventListener('keydown', (e) => {
            // Ignore when typing inside inputs/textareas
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                if (e.key === 'Enter' && document.activeElement.id === 'page-jump-input') {
                    jumpFromInput();
                }
                return;
            }

            if (/^[0-9]$/.test(e.key)) {
                digitBuffer += e.key;
                document.getElementById('header-page-code').textContent = `P${digitBuffer.padEnd(3, '-')}`;
                clearTimeout(digitBufferTimeout);

                if (digitBuffer.length === 3) {
                    const target = digitBuffer;
                    digitBuffer = '';
                    loadPage(target);
                } else {
                    digitBufferTimeout = setTimeout(() => {
                        digitBuffer = '';
                        document.getElementById('header-page-code').textContent = `P${currentPage}`;
                    }, 2000);
                }
            }
        });

        // Initialize Page 100 on Load
        window.onload = function () {
            loadPage('100');
        };
    </script>
</body>
</html>
