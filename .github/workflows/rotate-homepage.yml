
name: Daily Homepage Rotation

on:
  schedule:
    # Every day at 00:17 UTC
    - cron: '17 0 * * *'

  # Allow manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-rotation
  cancel-in-progress: false

jobs:
  rotate-homepage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select next homepage theme
        shell: bash
        run: |
          set -euo pipefail

          STATE_FILE=".github/homepage-rotation-index"

          # Find and alphabetically sort all homepage themes
          mapfile -t THEMES < <(
            find library -maxdepth 1 -type f -name '*.html' |
            LC_ALL=C sort
          )

          COUNT=${#THEMES[@]}

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No HTML themes found in library/"
            exit 1
          fi

          # Read the saved rotation position
          if [ -f "$STATE_FILE" ]; then
            NEXT_INDEX=$(cat "$STATE_FILE")
          else
            NEXT_INDEX=0
          fi

          # Validate the saved counter
          if ! [[ "$NEXT_INDEX" =~ ^[0-9]+$ ]]; then
            NEXT_INDEX=0
          fi

          # Select the next theme
          INDEX=$((NEXT_INDEX % COUNT))
          SELECTED="${THEMES[$INDEX]}"

          echo "Available themes: $COUNT"
          echo "Selected theme: $SELECTED"
          echo "Theme number: $((INDEX + 1))"

          # Replace the live homepage
          cp "$SELECTED" index.html

          # Save the next rotation position
          NEXT_INDEX=$(((INDEX + 1) % COUNT))

          mkdir -p .github
          echo "$NEXT_INDEX" > "$STATE_FILE"

      - name: Commit homepage update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html .github/homepage-rotation-index

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily homepage rotation"

          git push origin HEAD:main
